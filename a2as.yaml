manifest:
  version: "0.1.3"
  schema: https://a2as.org/cert/schema
  subject:
    name: artysicistz/nl2sql_bot
    source: https://github.com/artysicistz/nl2sql_bot
    branch: main
    commit: "194723e3"
    scope: [app/api.py, nl2sql/__init__.py, nl2sql/agent.py, nl2sql/agents/__init__.py, nl2sql/agents/model_provider.py, nl2sql/agents/plot_config_agent.py,
      nl2sql/agents/result_interpreter_agent.py, nl2sql/agents/sql_generator_agent.py, nl2sql/agents/sql_task_agent.py, nl2sql/tools/__init__.py,
      nl2sql/tools/agentic/__init__.py, nl2sql/tools/agentic/agentic_output_tool.py, nl2sql/tools/agentic/agentic_plot_tool.py,
      nl2sql/tools/agentic/agentic_result_tool.py, nl2sql/tools/agentic/agentic_sql_tool.py, nl2sql/tools/agentic/agentic_utils.py,
      nl2sql/tools/sql/__init__.py, nl2sql/tools/sql/generate_sql.py, nl2sql/tools/sql/sql_utils.py, nl2sql/utils/__init__.py]
  issued:
    by: A2AS.org
    at: '2026-02-11T16:47:05Z'
    url: https://a2as.org/certified/agents/artysicistz/nl2sql_bot
  signatures:
    digest: sha256:z3FwgsXxaqiyqnKHNqyy53naCOoVk-42qfaPisC5Cig
    key: ed25519:R-N4FHnw8D2CguDUoINUOqMbgg45Poi2YIlXkN05er4
    sig: ed25519:3v9C3_v3XjMRqDdWr3WeW-N_v0XOHH68Zz4wGUHfNhV7LB0i9_yfk8GRqY9jGumF70ZM3bIDLVH1G6F3MAzJAg

agents:
  plot_config_agent:
    type: instance
    models: [get_model]
    tools: [save_plot_config, request_sql_retry]
    params:
      name: plot_config_agent
      description: Generates JSON plot configuration from SQL queries.
      instruction:
        function: load_prompt
        type: file_load
        file: plot_config_agent
  result_interpreter_agent:
    type: instance
    models: [get_model]
    tools: [save_answer]
    params:
      name: result_interpreter_agent
      description: Interprets raw SQL results and answers the user.
      instruction:
        function: load_prompt
        type: file_load
        file: result_interpreter_agent
  root_agent:
    type: instance
    models: [get_model]
    tools: [run_sql_task_agent_tool, run_plot_config_agent_tool, run_result_interpreter_agent_tool, run_output_tool]
    params:
      name: nl2sql_root
      description: Orchestrates SQL, plot config, interpretation, and final output.
      instruction:
        function: load_prompt
        type: file_load
        file: root_agent
  sql_generator_agent:
    type: instance
    models: [get_model]
    params:
      name: sql_generator_agent
      description: Generates read-only SQL for a single target table.
      instruction:
        function: load_prompt
        type: file_load
        file: sql_generator_agent
  sql_task_agent:
    type: instance
    models: [get_model]
    tools: [generate_sql, run_sql]
    params:
      name: sql_task_agent
      description: Handles SQL generation and SQL execution.
      instruction:
        function: load_prompt
        type: file_load
        file: sql_task_agent

models:
  get_model:
    type: function
    agents: [plot_config_agent, root_agent, sql_task_agent, sql_generator_agent, result_interpreter_agent]
    params:
      wrapper: get_model
      arg_0: PLOT_CONFIG_MODEL

tools:
  _PLOT_CONFIG_TOOL:
    type: agent
    params:
      wrapper: AgentTool
  _RESULT_INTERPRETER_TOOL:
    type: agent
    params:
      wrapper: AgentTool
  _SQL_GENERATOR_TOOL:
    type: agent
    params:
      wrapper: AgentTool
  _SQL_TASK_TOOL:
    type: agent
    params:
      wrapper: AgentTool
  generate_sql:
    type: function
    agents: [sql_task_agent]
    params:
      description: Call SQLGeneratorAgent and wrap its SQL output as JSON.
  request_sql_retry:
    type: function
    agents: [plot_config_agent]
    params:
      description: Record a request to rerun the SQL tool with a refinement.
  run_output_tool:
    type: function
    agents: [root_agent]
    params:
      description: Assemble final JSON output directly from state.
  run_plot_config_agent_tool:
    type: function
    agents: [root_agent]
    params:
      description: Call plot_config_agent with SQL query loaded from state.
  run_result_interpreter_agent_tool:
    type: function
    agents: [root_agent]
    params:
      description: Call result_interpreter_agent with SQL results loaded from state.
  run_sql:
    type: function
    agents: [sql_task_agent]
    params:
      description: Execute SQL after validating it is read-only.
  run_sql_task_agent_tool:
    type: function
    agents: [root_agent]
    params:
      description: |-
        Load schemas, call sql_task_agent, and persist SQL results.
        This tool is able to handle complex and multiple user requests in one call, never call me twice consequently if user question contains multiple parts about different sql commands.
  save_answer:
    type: function
    agents: [result_interpreter_agent]
    params:
      description: Persist the answer text in tool_context.state.
  save_plot_config:
    type: function
    agents: [plot_config_agent]
    params:
      description: Persist plot_config JSON in tool_context.state for downstream agents.

